<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח בחינות ואירועים - תיכון דרכא</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Heebo', sans-serif; }
        [x-cloak] { display: none !important; }
        
        .progress-fill {
            animation: shrinkWidth 3s linear forwards;
        }
        @keyframes shrinkWidth {
            from { width: 100%; }
            to { width: 0%; }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body :class="isLightTheme ? 'bg-slate-100 text-slate-900' : 'bg-gray-950 text-gray-100'" class="min-h-screen relative shadow-inner overflow-x-hidden transition-colors duration-300" x-data="examsApp()">

    <!-- Splash Screen -->
    <div x-show="showSplash" 
         x-transition:leave="transition ease-in duration-500"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         :class="isLightTheme ? 'bg-slate-100' : 'bg-gray-950'"
         class="fixed inset-0 z-[100] flex flex-col items-center justify-between p-6 text-center select-none">
        
        <div></div>

        <div class="flex flex-col items-center max-w-lg px-4 gap-6">
            <div class="w-48 md:w-64">
                <img src="לוגו דרכא שקוף.png" alt="תיכון דרכא" class="w-full h-auto object-contain">
            </div>
            <div class="h-px w-24" :class="isLightTheme ? 'bg-slate-300' : 'bg-gray-800'"></div>
            <p class="text-xl md:text-2xl font-medium text-emerald-500 leading-relaxed" x-text="motivationalQuote"></p>
        </div>

        <div class="w-full max-w-xs mb-8">
            <button @click="showSplash = false" :class="isLightTheme ? 'bg-white border-slate-300 text-slate-800' : 'bg-gray-900 border-gray-800 text-white'" class="relative w-full border rounded-xl py-3 px-6 text-sm font-bold overflow-hidden hover:border-emerald-500 transition active:scale-[0.98]">
                <div class="absolute inset-y-0 right-0 bg-emerald-600/20 progress-fill"></div>
                <span class="relative z-10 flex items-center justify-center gap-2">
                    דלג אל הלוח
                    <svg class="w-4 h-4 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </span>
            </button>
        </div>
    </div>

    <div>
        <header :class="isLightTheme ? 'border-slate-200 bg-white/80' : 'border-gray-800 bg-gray-900/50'" class="border-b backdrop-blur-md sticky top-0 z-50 px-4 py-3 transition-colors duration-300">
            <div class="max-w-5xl mx-auto flex flex-row items-center justify-between gap-4">
                
                <div class="flex items-center gap-3">
                    <!-- כפתור הגדרות -->
                    <div class="relative" @click.outside="showSettingsMenu = false">
                        <button @click="showSettingsMenu = !showSettingsMenu" 
                                :class="isLightTheme ? 'hover:bg-slate-200 text-slate-700' : 'hover:bg-gray-800 text-gray-200'"
                                class="p-2 rounded-full transition focus:outline-none" 
                                title="הגדרות">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                        </button>

                        <!-- תפריט הגדרות -->
                        <div x-show="showSettingsMenu" 
                             x-cloak
                             x-transition
                             :class="isLightTheme ? 'bg-white border-slate-200 shadow-xl text-slate-800' : 'bg-gray-900 border-gray-800 shadow-2xl text-gray-100'"
                             class="absolute right-0 mt-2 w-60 border rounded-xl overflow-hidden z-50 text-sm">
                            
                            <button @click="showHolidays = !showHolidays" 
                                    :class="isLightTheme ? 'hover:bg-slate-100 border-slate-100' : 'hover:bg-gray-800 border-gray-800'"
                                    class="w-full text-right px-4 py-3 border-b transition flex items-center justify-between">
                                <span>הצג חופשות</span>
                                <span class="text-xs text-amber-500 font-bold" x-text="showHolidays ? '✓' : ''"></span>
                            </button>

                            <button @click="showGeneralEvents = !showGeneralEvents" 
                                    :class="isLightTheme ? 'hover:bg-slate-100 border-slate-100' : 'hover:bg-gray-800 border-gray-800'"
                                    class="w-full text-right px-4 py-3 border-b transition flex items-center justify-between">
                                <span>הצג אירועים כלליים</span>
                                <span class="text-xs text-indigo-400 font-bold" x-text="showGeneralEvents ? '✓' : ''"></span>
                            </button>

                            <button @click="showPastEvents = !showPastEvents" 
                                    :class="isLightTheme ? 'hover:bg-slate-100 border-slate-100' : 'hover:bg-gray-800 border-gray-800'"
                                    class="w-full text-right px-4 py-3 border-b transition flex items-center justify-between">
                                <span x-text="showPastEvents ? 'הסתר אירועי עבר' : 'הצג אירועי עבר'"></span>
                                <span class="text-xs text-emerald-500 font-bold" x-text="showPastEvents ? '✓' : ''"></span>
                            </button>

                            <button @click="isLightTheme = !isLightTheme; showSettingsMenu = false" 
                                    :class="isLightTheme ? 'hover:bg-slate-100' : 'hover:bg-gray-800'"
                                    class="w-full text-right px-4 py-3 transition flex items-center justify-between">
                                <span x-text="isLightTheme ? 'הפוך למצב כהה' : 'הפוך למצב בהיר'"></span>
                            </button>
                        </div>
                    </div>

                    <div class="flex flex-col text-right">
                        <h1 :class="isLightTheme ? 'text-slate-900' : 'text-white'" class="text-lg md:text-xl font-bold tracking-tight">לוח בחינות ואירועים</h1>
                        <p class="text-xs md:text-sm text-emerald-500 font-medium mt-0.5" x-text="motivationalQuote"></p>
                    </div>
                </div>

                <div class="w-28 md:w-36 shrink-0 flex justify-end">
                    <img src="לוגו דרכא שקוף.png" alt="תיכון דרכא" class="max-h-10 md:max-h-12 w-auto object-contain">
                </div>

            </div>

            <div class="max-w-5xl mx-auto mt-3">
                <div :class="isLightTheme ? 'bg-slate-200/60 border-slate-300' : 'bg-gray-900 border-gray-800/80'" class="flex flex-wrap items-center gap-3 p-2 rounded-xl border w-full transition-colors duration-300">
                    <div class="flex-1 min-w-[120px]">
                        <select x-model="selectedLayer" @change="handleLayerChange()" :class="isLightTheme ? 'bg-white text-slate-800 border-slate-300' : 'bg-gray-800 text-white border-gray-700'" class="w-full text-sm rounded-lg border px-3 py-2 focus:outline-none focus:border-emerald-500 transition">
                            <option value="all">כלל בית הספר</option>
                            <option value="ט">שכבת ט'</option>
                            <option value="י">שכבת י'</option>
                            <option value="יא">שכבת יא'</option>
                            <option value="יב">שכבת יב'</option>
                        </select>
                    </div>

                    <div class="flex-1 min-w-[110px]">
                        <select x-model="selectedClass" :disabled="selectedLayer === 'all'" :class="isLightTheme ? 'bg-white text-slate-800 border-slate-300' : 'bg-gray-800 text-white border-gray-700'" class="w-full text-sm rounded-lg border px-3 py-2 focus:outline-none focus:border-emerald-500 transition disabled:opacity-40 disabled:cursor-not-allowed">
                            <option value="all">כל השכבה</option>
                            <template x-for="cls in availableClasses" :key="cls">
                                <option :value="cls" x-text="cls"></option>
                            </template>
                        </select>
                    </div>

                    <div class="w-full sm:w-52 relative">
                        <input type="text" x-model="searchQuery" placeholder="חיפוש חופשי..." :class="isLightTheme ? 'bg-white text-slate-800 border-slate-300 placeholder-slate-400' : 'bg-gray-800 text-white border-gray-700 placeholder-gray-500'" class="w-full text-sm rounded-lg border pr-8 pl-3 py-2 focus:outline-none focus:border-emerald-500 transition">
                        <span class="absolute right-2.5 top-2.5 text-gray-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </span>
                    </div>
                </div>
            </div>
        </header>

        <main class="max-w-5xl mx-auto px-4 py-6">
            
            <div x-show="loading" class="flex flex-col items-center justify-center py-20 gap-3">
                <div class="w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
                <p :class="isLightTheme ? 'text-slate-500' : 'text-gray-400'" class="text-sm">טוען נתונים ומסנכרן את הלוח...</p>
            </div>

            <div x-show="!loading && error" class="bg-red-950/40 border border-red-800/60 text-red-200 p-4 rounded-xl text-center" x-text="error" x-cloak></div>

            <div x-show="!loading && filteredEvents.length === 0" :class="isLightTheme ? 'bg-white/60 border-slate-300' : 'bg-gray-900/20 border-gray-800/60'" class="text-center py-16 border rounded-xl" x-cloak>
                <p :class="isLightTheme ? 'text-slate-500' : 'text-gray-400'">לא נמצאו בחינות או אירועים העונים על סינון זה.</p>
            </div>

            <div x-show="!loading && filteredEvents.length > 0" class="space-y-2" x-cloak>
                <template x-for="event in filteredEvents" :key="event.id">
                    <div :class="{
                            'bg-amber-500/10 border-amber-500/30 hover:border-amber-500/50': event.isHoliday,
                            'bg-indigo-500/10 border-indigo-500/30 hover:border-indigo-500/50': event.isGeneral,
                            'bg-white border-slate-200 hover:border-slate-300': !event.isHoliday && !event.isGeneral && isLightTheme,
                            'bg-gray-900/60 hover:bg-gray-900 border-gray-800 hover:border-gray-700/80': !event.isHoliday && !event.isGeneral && !isLightTheme
                         }" 
                         class="flex items-center gap-3 p-3 border rounded-xl transition duration-150">
                        
                        <div :class="isLightTheme ? 'bg-slate-100/80 border-slate-300 text-slate-700' : 'bg-gray-800/80 border-gray-700 text-gray-200'" class="flex items-center gap-2 border px-3 py-1.5 rounded-lg shrink-0 text-xs sm:text-sm font-medium">
                            <span x-text="event.formattedDate"></span>
                            <span class="text-gray-400 font-normal">|</span>
                            <span x-text="event.dayOfWeek" class="text-emerald-500 font-bold"></span>
                        </div>

                        <div class="flex-1 min-w-0 overflow-x-auto no-scrollbar">
                            <div class="flex items-center gap-2.5 whitespace-nowrap w-max">
                                <span :class="isLightTheme ? 'text-slate-800' : 'text-gray-100'" class="text-sm sm:text-base font-medium" x-text="event.title"></span>

                                <!-- תגית סיווג -->
                                <span :class="{
                                        'bg-amber-500/20 text-amber-500 border-amber-500/30': event.isHoliday,
                                        'bg-indigo-500/20 text-indigo-400 border-indigo-500/30': event.isGeneral,
                                        'bg-emerald-500/10 text-emerald-500 border-emerald-500/20': !event.isHoliday && !event.isGeneral
                                      }" 
                                      class="text-xs font-semibold px-2.5 py-0.5 rounded-md border shrink-0" 
                                      x-text="event.targetDisplay">
                                </span>
                            </div>
                        </div>

                    </div>
                </template>
            </div>
        </main>
    </div>

    <script>
        function examsApp() {
            return {
                spreadsheetId: '1TIwnott9Y7pTugeQ5Il-U00dUe5GE6Mcc7lRqfxuCBM', 
                loading: true,
                error: null,
                allEvents: [],
                availableClasses: [],
                selectedLayer: 'all',
                selectedClass: 'all',
                searchQuery: '',
                motivationalQuote: '',
                showSplash: true,
                showSettingsMenu: false,
                showPastEvents: false,     
                showHolidays: true,        
                showGeneralEvents: true,   
                isLightTheme: false,       
                
                quotes: [
                    "ההשקעה של היום היא ההצלחה של מחר.",
                    "הדרך להצלחה מתחילה בהחלטה לא לוותר!",
                    "העתיד שלכם מתחיל בהחלטות שאתם מקבלים היום.",
                    "אל תוותרו על החלום רק כי הדרך מאתגרת.",
                    "האמינו בעצמכם, אתם מסוגלים ליותר ממה שאתם חושבים.",
                    "אל תשוו את עצמכם לאחרים, התקדמו בקצב שלכם.",
                    "אל תפחדו לטעות – כך לומדים, מתקדמים ומצליחים.",
                    "כל יום הוא הזדמנות ללמוד משהו חדש."
                ],

                init() {
                    this.motivationalQuote = this.quotes[Math.floor(Math.random() * this.quotes.length)];
                    
                    setTimeout(() => {
                        this.showSplash = false;
                    }, 3000);

                    google.charts.load('current', {'packages':['corechart']});
                    google.charts.setOnLoadCallback(() => this.fetchExamsData());
                },

                fetchExamsData() {
                    this.loading = true;
                    this.error = null;

                    // שאילתה בודדת לגיליון Exams
                    const urlExams = `https://docs.google.com/spreadsheets/d/${this.spreadsheetId}/gviz/tq?sheet=Exams&tq=` + encodeURIComponent("SELECT A, B, C, D");
                    const query = new google.visualization.Query(urlExams);

                    query.send(response => {
                        if (response.isError()) {
                            this.error = "שגיאה בטעינת הנתונים: " + response.getMessage();
                            this.loading = false;
                            return;
                        }

                        const dt = response.getDataTable();
                        const rows = dt.getNumberOfRows();
                        let rawEvents = [];

                        for (let i = 0; i < rows; i++) {
                            const dateVal = dt.getValue(i, 0);
                            const dayVal = dt.getValue(i, 1);
                            const classVal = dt.getValue(i, 2);
                            const eventVal = dt.getValue(i, 3);

                            if (dateVal && eventVal) {
                                let rawDate = this.parseGoogleDate(dateVal);
                                if (rawDate) {
                                    const typeOrClassStr = classVal ? String(classVal).trim() : '';
                                    const eventStr = String(eventVal).trim();

                                    const isHoliday = typeOrClassStr.includes('חופש');
                                    const isGeneral = typeOrClassStr.includes('כללי');

                                    let layer = 'all';
                                    let specificClass = 'all';

                                    if (!isHoliday && !isGeneral) {
                                        const cleanStr = typeOrClassStr.replace(/['"׳]/g, '');
                                        if (/^ט\d+/.test(cleanStr)) { layer = 'ט'; specificClass = typeOrClassStr; }
                                        else if (/^יא\d+/.test(cleanStr)) { layer = 'יא'; specificClass = typeOrClassStr; }
                                        else if (/^יב\d+/.test(cleanStr)) { layer = 'יב'; specificClass = typeOrClassStr; }
                                        else if (/^י\d+/.test(cleanStr)) { layer = 'י'; specificClass = typeOrClassStr; }
                                        else {
                                            if (cleanStr === 'ט') layer = 'ט';
                                            else if (cleanStr === 'י') layer = 'י';
                                            else if (cleanStr === 'יא') layer = 'יא';
                                            else if (cleanStr === 'יב') layer = 'יב';
                                        }
                                    }

                                    rawEvents.push({
                                        dateObj: rawDate,
                                        formattedDate: this.formatDate(rawDate),
                                        dayOfWeek: dayVal || this.getDayName(rawDate),
                                        title: eventStr,
                                        layer: layer,
                                        specificClass: specificClass,
                                        isHoliday: isHoliday,
                                        isGeneral: isGeneral,
                                        classRawValue: typeOrClassStr
                                    });
                                }
                            }
                        }

                        this.processEvents(rawEvents);
                    });
                },

                processEvents(rawEvents) {
                    this.loading = false;

                    const groupedMap = {};
                    rawEvents.forEach(event => {
                        const dateKey = event.dateObj.getTime();
                        const titleKey = event.title.toLowerCase().trim();
                        const groupKey = `${dateKey}_${titleKey}`;

                        if (!groupedMap[groupKey]) {
                            groupedMap[groupKey] = {
                                dateObj: event.dateObj,
                                formattedDate: event.formattedDate,
                                dayOfWeek: event.dayOfWeek,
                                title: event.title,
                                isHoliday: event.isHoliday,
                                isGeneral: event.isGeneral,
                                layers: new Set([event.layer]),
                                classes: new Set(event.specificClass !== 'all' ? [event.specificClass] : []),
                                rawTargets: new Set([event.classRawValue])
                            };
                        } else {
                            groupedMap[groupKey].layers.add(event.layer);
                            if (event.specificClass !== 'all') {
                                groupedMap[groupKey].classes.add(event.specificClass);
                            }
                            groupedMap[groupKey].rawTargets.add(event.classRawValue);
                            if (event.isHoliday) groupedMap[groupKey].isHoliday = true;
                            if (event.isGeneral) groupedMap[groupKey].isGeneral = true;
                        }
                    });

                    this.allEvents = Object.values(groupedMap).map((g, idx) => {
                        const classesArr = Array.from(g.classes).sort();
                        const layersArr = Array.from(g.layers);
                        const rawTargetsArr = Array.from(g.rawTargets).filter(t => t !== '');

                        let targetDisplay = '';
                        if (g.isHoliday) {
                            targetDisplay = 'חופש';
                        } else if (g.isGeneral) {
                            targetDisplay = 'כללי';
                        } else if (classesArr.length > 0) {
                            targetDisplay = classesArr.join(', ');
                        } else if (rawTargetsArr.length > 0) {
                            targetDisplay = rawTargetsArr.join(', ');
                        } else {
                            targetDisplay = 'כללי';
                        }

                        return {
                            id: `grouped-${idx}-${g.dateObj.getTime()}`,
                            dateObj: g.dateObj,
                            formattedDate: g.formattedDate,
                            dayOfWeek: g.dayOfWeek,
                            title: g.title,
                            isHoliday: g.isHoliday,
                            isGeneral: g.isGeneral,
                            layers: layersArr, 
                            classes: classesArr, 
                            targetDisplay: targetDisplay
                        };
                    }).sort((a, b) => a.dateObj - b.dateObj);

                    this.handleLayerChange();
                },

                handleLayerChange() {
                    this.selectedClass = 'all';
                    if (this.selectedLayer === 'all') {
                        this.availableClasses = [];
                        return;
                    }
                    
                    let classesSet = new Set();
                    this.allEvents.forEach(e => {
                        if (e.layers.includes(this.selectedLayer)) {
                            e.classes.forEach(c => classesSet.add(c));
                        }
                    });
                    
                    this.availableClasses = Array.from(classesSet).sort();
                },

                get filteredEvents() {
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);

                    return this.allEvents.filter(event => {
                        // הסתרת אירועי עבר
                        if (!this.showPastEvents && event.dateObj && event.dateObj < today) {
                            return false;
                        }

                        // סינון לפי הגדרות תפריט (חופש/כללי)
                        if (event.isHoliday) {
                            if (!this.showHolidays) return false;
                        } else if (event.isGeneral) {
                            if (!this.showGeneralEvents) return false;
                        } else {
                            // סינון לפי שכבה וכיתה בלבד עבור מבחנים רגילים
                            if (this.selectedLayer !== 'all' && !event.layers.includes(this.selectedLayer)) return false;
                            if (this.selectedClass !== 'all' && event.classes.length > 0 && !event.classes.includes(this.selectedClass)) return false;
                        }

                        // חיפוש חופשי
                        if (this.searchQuery.trim() !== '') {
                            const query = this.searchQuery.toLowerCase();
                            return event.title.toLowerCase().includes(query) || 
                                   event.targetDisplay.toLowerCase().includes(query) ||
                                   event.formattedDate.includes(query);
                        }

                        return true;
                    });
                },

                parseGoogleDate(dateVal) {
                    if (dateVal instanceof Date) return dateVal;

                    if (typeof dateVal === 'number') {
                        return new Date(Math.round((dateVal - 25569) * 86400 * 1000));
                    }

                    if (typeof dateVal === 'string') {
                        if (dateVal.startsWith('Date(')) {
                            let parts = dateVal.match(/\d+/g);
                            if (parts) return new Date(parts[0], parts[1], parts[2]);
                        }

                        let parts = dateVal.split(/[\/\.-]/);
                        if (parts.length === 3) {
                            let day = parseInt(parts[0], 10);
                            let month = parseInt(parts[1], 10) - 1;
                            let year = parseInt(parts[2], 10);
                            if (year < 100) year += 2000;
                            return new Date(year, month, day);
                        }

                        let timestamp = Date.parse(dateVal);
                        if (!isNaN(timestamp)) return new Date(timestamp);
                    }
                    return null;
                },

                formatDate(date) {
                    return date.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: '2-digit' });
                },

                getDayName(date) {
                    return date.toLocaleDateString('he-IL', { weekday: 'short' });
                }
            };
        }
    </script>
</body>
</html>
